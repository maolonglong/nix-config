name: Upstream watch

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze without creating issues or cursor state
        type: boolean
        default: true

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: automation/upstream-watch/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: automation/upstream-watch/pnpm-lock.yaml

      - name: Install agent dependencies
        working-directory: automation/upstream-watch
        run: pnpm install --frozen-lockfile

      - name: Analyze new upstream commits
        working-directory: automation/upstream-watch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UPSTREAM_WATCH_OUTPUT: ${{ runner.temp }}/upstream-watch
        run: node scripts/analyze.mjs

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: upstream-watch-analysis
          path: ${{ runner.temp }}/upstream-watch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: upstream-watch-analysis
          path: ${{ runner.temp }}/upstream-watch

      - name: Publish decisions and advance cursor
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_WATCH_OUTPUT: ${{ runner.temp }}/upstream-watch
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node automation/upstream-watch/scripts/publish.mjs
