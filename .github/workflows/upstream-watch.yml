name: Upstream watch

on:
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze without creating issues or cursor state
        type: boolean
        default: true

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: automation/upstream-watch/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: automation/upstream-watch/pnpm-lock.yaml

      - name: Install agent dependencies
        working-directory: automation/upstream-watch
        run: pnpm install --frozen-lockfile

      - name: Analyze new upstream commits
        working-directory: automation/upstream-watch
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          UPSTREAM_WATCH_OUTPUT: ${{ runner.temp }}/upstream-watch
        run: node scripts/analyze.mjs

      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upstream-watch-analysis
          path: |
            ${{ runner.temp }}/upstream-watch/manifest.json
            ${{ runner.temp }}/upstream-watch/feedback.json
            ${{ runner.temp }}/upstream-watch/results
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: upstream-watch-analysis
          path: ${{ runner.temp }}/upstream-watch

      - name: Publish decisions and advance cursor
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_WATCH_OUTPUT: ${{ runner.temp }}/upstream-watch
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node automation/upstream-watch/scripts/publish.mjs
